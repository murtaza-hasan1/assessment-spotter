services:
  - type: web
    name: stormhaul-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: TOMTOM_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
