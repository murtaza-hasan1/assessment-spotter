<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a74af" />
      <stop offset="100%" stop-color="#1b4f77" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa672" />
      <stop offset="100%" stop-color="#ef8557" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle (Deep Editorial Blue) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#3985bf" stroke-width="1.5" />

  <!-- Coral Sun with Rays -->
  <g transform="translate(37, 24)" filter="url(#shadow)">
    <!-- Sun Rays -->
    <circle cx="0" cy="0" r="8.5" fill="url(#sunGrad)" />
    <path d="M0 -12.5 L0 -10.5 M0 10.5 L0 12.5 M-12.5 0 L-10.5 0 M10.5 0 L12.5 0 M-8.5 -8.5 L-7 -7 M7 7 L8.5 8.5 M-8.5 8.5 L-7 7 M7 -7 L8.5 -8.5" 
          stroke="#ef8557" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Crisp White Front Cloud -->
  <path d="M21 44 
           h22 
           a8 8 0 0 0 2-15.7 
           a12 12 0 0 0 -22.3 -3.3 
           a7.5 7.5 0 0 0 -9.7 7 
           a8 8 0 0 0 8 12 z" 
        fill="#ffffff" 
        filter="url(#shadow)" />
</svg>

